name: Build & Release

# Push a version tag (e.g. `git tag v3.9.6 && git push origin v3.9.6`) to build the
# Windows installer and publish it as a public GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and (re)publish, e.g. v3.9.6"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check tag matches APP_VERSION
        shell: pwsh
        run: |
          $appVersion = (python -c "from src.core.config import APP_VERSION; print(APP_VERSION)").Trim()
          if ($appVersion -ne $env:RELEASE_TAG) {
            Write-Error "Tag '$env:RELEASE_TAG' does not match APP_VERSION '$appVersion' in src/core/config.py"
            exit 1
          }
          Write-Host "Building RawView $appVersion"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build app and installer
        run: python build_release.py

      - name: Extract release notes
        shell: python
        run: |
          from pathlib import Path
          body, seen_title = [], False
          for line in Path("RELEASE_NOTES.md").read_text(encoding="utf-8").splitlines():
              if line.startswith("# "):
                  if seen_title:
                      break
                  seen_title = True
                  continue
              body.append(line)
          while body and body[-1].strip() in ("", "---"):
              body.pop()
          Path("release_body.md").write_text("\n".join(body).strip() + "\n", encoding="utf-8")

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist_installer/RawView_$($env:RELEASE_TAG)_Setup.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "Installer not found: $setup"
            exit 1
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $setup --clobber
          } else {
            gh release create $env:RELEASE_TAG $setup `
              --title "RawView $env:RELEASE_TAG" `
              --notes-file release_body.md `
              --verify-tag `
              --latest
          }
          exit $LASTEXITCODE
